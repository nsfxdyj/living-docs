<svg xmlns="http://www.w3.org/2000/svg" width="260" height="420" viewBox="0 0 260 420" fill="none">
  <!-- Herbarium sprig: a single stem with alternating leaflets, drawn as
       fine ink lines in the tradition of pressed botanical specimens. -->
  <g stroke="#5c6b52" stroke-width="1.4" stroke-linecap="round" fill="none">
    <!-- main stem -->
    <path d="M130 410 C 128 340, 122 260, 128 180 C 132 120, 138 60, 132 14"/>
    <!-- leaflets, left -->
    <path d="M128 360 C 100 352, 76 330, 66 300 C 92 302, 118 326, 128 360 Z"/>
    <path d="M127 300 C 98 290, 76 266, 68 236 C 94 240, 118 264, 127 300 Z"/>
    <path d="M128 240 C 102 230, 82 208, 76 180 C 100 184, 120 206, 128 240 Z"/>
    <path d="M130 182 C 106 172, 90 152, 86 126 C 108 130, 124 150, 130 182 Z"/>
    <path d="M132 126 C 112 116, 100 98, 98 76 C 116 80, 128 98, 132 126 Z"/>
    <!-- leaflets, right -->
    <path d="M128 352 C 156 344, 180 322, 190 292 C 164 294, 138 318, 128 352 Z"/>
    <path d="M127 292 C 156 282, 178 258, 186 228 C 160 232, 136 256, 127 292 Z"/>
    <path d="M128 232 C 154 222, 174 200, 180 172 C 156 176, 136 198, 128 232 Z"/>
    <path d="M130 174 C 152 164, 166 144, 170 120 C 150 124, 136 142, 130 174 Z"/>
    <path d="M132 118 C 150 108, 160 92, 162 70 C 146 74, 136 90, 132 118 Z"/>
    <!-- terminal leaflet -->
    <path d="M132 14 C 124 34, 124 54, 131 72 C 138 54, 138 34, 132 14 Z"/>
  </g>
  <!-- faint handwritten-style caption ticks, like a collector's notes -->
  <g stroke="#8a7d5c" stroke-width="1" stroke-linecap="round" opacity="0.6">
    <path d="M196 396 h42 M196 404 h30 M196 412 h36"/>
  </g>
</svg>
