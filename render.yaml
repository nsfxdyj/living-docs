# Render Blueprint: one-click deploy of Living Docs as a single web service.
# The root Dockerfile builds the frontend and serves it from the backend.
#
# Free tier note: disks are not supported on the free plan, so SQLite and
# uploads live on the ephemeral filesystem — data resets on every deploy or
# restart. That is acceptable for a public demo; for a persistent instance,
# switch to a paid plan and re-add a disk mounted at /data.
services:
  - type: web
    name: living-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # JWT signing key, generated once by Render on first deploy.
      - key: LIVING_DOCS_SECRET_KEY
        generateValue: true
      # Ephemeral storage inside the container (see note above).
      - key: LIVING_DOCS_DATABASE_URL
        value: sqlite:////tmp/living_docs.db
      - key: LIVING_DOCS_ATTACHMENTS_DIR
        value: /tmp/attachments
